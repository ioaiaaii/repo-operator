style: github
template: release-CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/ioaiaaii/ioaiaaii.net
options:
  commits:
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
        - chore
        - ci
        - build
  commit_groups:
    title_maps:
      feat: "✨ Features"
      fix: "🐛 Bug Fixes"
      perf: "⚡ Performance Improvements"
      refactor: "♻️ Code Refactoring"
      docs: "📚 Documentation"
      chore: "🛠️ Chores"
      build: "📦 Build System"
      ci: "👷 Continuous Integration"

  header:
    pattern: "^(\\w*)(?:\\(([\\w\\$\\.\\-\\*\\s]*)\\))?\\:\\s(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE
