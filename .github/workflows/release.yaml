name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags starting with 'v'

# createRelease is the only write this workflow performs.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # git-chglog reads the full history

      - name: Run Makefile Target and Capture Output
        id: generate_changelog
        env:
          TAG: ${{ github.ref_name }}  # Set the tag for the Makefile
        run: |
          # Run the Makefile target with the specified TAG and capture output
          changelog=$(make op-changelog-release TAG=$TAG)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.generate_changelog.outputs.changelog }}
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const changelog = process.env.CHANGELOG;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `${tag}`,
              body: changelog,
              draft: false,
              prerelease: false
            });
