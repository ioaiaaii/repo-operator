name: Makefiles

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify makefiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Every recipe must parse. Catches quoting errors like the unbalanced
      # --build-arg that left image-build broken and unnoticed.
      - name: Parse every target
        run: |
          cat makefiles/*.mk > /tmp/all.mk
          fail=0
          for t in $(grep -hoE '^[a-z][a-zA-Z0-9_.-]*:' makefiles/*.mk | tr -d ':' | sort -u); do
            make -f /tmp/all.mk -n "$t" >/dev/null 2>/tmp/err || {
              echo "::error file=makefiles::target '$t' fails to parse"; sed 's/^/    /' /tmp/err; fail=1; }
          done
          exit $fail

      # A name defined twice is resolved by include order, not intent. This
      # caught CHART_TESTING_SHA carrying two different digests.
      - name: No duplicate target or variable names
        run: |
          dupes=$(grep -hoE '^[a-z][a-zA-Z0-9_.-]*:' makefiles/*.mk | tr -d ':' | sort | uniq -d)
          [ -z "$dupes" ] || { echo "::error::duplicate targets: $dupes"; exit 1; }
          vars=$(grep -hoE '^[A-Z_][A-Z0-9_]* *:?\??=' makefiles/*.mk | sed 's/ *:\?\??=//' \
                 | grep -v '^IMAGE_' | sort | uniq -d)
          [ -z "$vars" ] || { echo "::error::variable defined in two files: $vars"; exit 1; }

      # Undocumented targets vanish from `make help`, so help silently stops
      # matching reality.
      - name: Every target is documented
        run: |
          undocumented=$(grep -hE '^[a-z][a-zA-Z0-9_.-]*:' makefiles/*.mk | grep -v '##' | cut -d: -f1 | sort -u)
          [ -z "$undocumented" ] || { echo "::error::missing '## description': $undocumented"; exit 1; }

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
